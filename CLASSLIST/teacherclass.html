<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Classes</title>
    <link rel="stylesheet" href="teacherclass.css">
</head>

<body>

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="profile">
            <div class="profile-icon">
                <div class="head"></div>
                <div class="body"></div>
            </div>

            <span>USER NAME</span>
        </div>

        <button class="logout-btn" onclick="logout()">
            LOGOUT
        </button>

    </header>


    <!-- MAIN PANEL -->
    <main class="classes-panel">

        <h1>MY CLASSES</h1>

        <p class="subtitle">
            Select classes to view the students.
        </p>

        <button class="create-btn" onclick="createClass()">
            CREATE CLASS
        </button>


        <!-- CLASS LIST -->
        <div id="classList">

            <div class="class-row">

                <button class="class-name"
                        onclick="selectClass('BSIT 2-3')">
                    BSIT 2-3
                </button>

                <button class="action-btn"
                        onclick="joinClass('BSIT 2-3')">
                    STUDENT JOIN CLASS<br>
                    QR
                </button>

                <button class="action-btn"
                        onclick="deleteClass(this)">
                    DELETE CLASS
                </button>

            </div>


            <div class="class-row">

                <button class="class-name"
                        onclick="selectClass('BSIT 2-4')">
                    BSIT 2-4
                </button>

                <button class="action-btn"
                        onclick="joinClass('BSIT 2-4')">
                    STUDENT JOIN CLASS<br>
                    QR
                </button>

                <button class="action-btn"
                        onclick="deleteClass(this)">
                    DELETE CLASS
                </button>

            </div>

        </div>

    </main>

    <script src="teacherclass.js"></script>

</body>
</html>
