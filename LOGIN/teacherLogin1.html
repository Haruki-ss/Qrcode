<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Attendance</title>

    <link rel="stylesheet" href="teacherLogin1.css">
</head>

<body>

    <div class="page">

        <!-- LEFT SIDE -->
        <div class="left-side">

            <h1>
                QR CODE<br>
                ATTENDANCE
            </h1>

            <div class="description">
                Manage your classes and student attendance with ease. Create
                classes, generate QR codes, and keep accurate attendance
                records all in one system.
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-side">

            <!-- LOGIN FORM -->
            <div class="login-form" id="loginForm">

                <h2>LOGIN</h2>

                <input
                    type="email"
                    placeholder="EMAIL"
                >

                <input
                    type="password"
                    placeholder="PASSWORD"
                >


                <div class="options">

                    <label>
                        <input type="checkbox">
                        REMEMBER ME
                    </label>

                    <a href="">
                        FORGET PASSWORD
                    </a>

                </div>


                <button onclick="login()">
                    LOGIN
                </button>


                <p class="signup-text">
                    Don't have an account?
                    <span onclick="showSignup()">
                        SIGN UP
                    </span>
                </p>

            </div>


            <!-- SIGN UP FORM -->
            <div class="signup-form" id="signupForm">

                <h2>SIGN UP</h2>

                <input
                    type="text"
                    placeholder="FULL NAME"
                >

                <input
                    type="email"
                    placeholder="EMAIL"
                >

                <input
                    type="password"
                    placeholder="PASSWORD"
                >

                <input
                    type="password"
                    placeholder="CONFIRM PASSWORD"
                >


                <button onclick="signup()">
                    SIGN UP
                </button>


                <p class="signup-text">
                    Already have an account?
                    <span onclick="showLogin()">
                        LOGIN
                    </span>
                </p>

            </div>

        </div>

    </div>


    <script src="teacherLogin1.js"></script>

</body>

</html>
